<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>MintSoda</title>
    <link rel="icon" href="/favicon.ico"/>
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#ffffff">
    <meta name="robots" content="noindex">
    <meta name="description" content="RSS 追番订阅与下载工具"/>
    <meta name="color-scheme" content="light dark"/>
</head>
<script>
    (() => {
        if (location.pathname.endsWith('/')) {
            return;
        }
        location.pathname += '/'
    })()
</script>
<body>
<!-- 首屏占位：脚本加载完成前先显示图标与名称，避免白屏闪烁；挂载后淡出移除。 -->
<div class="boot-splash" aria-hidden="true">
    <img class="boot-splash-logo" src="/icon.svg" alt=""/>
    <div class="boot-splash-name">MintSoda</div>
    <div class="boot-splash-bar"><span></span></div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
<style>
    @import "@/css/style.css";
    @import "@/css/ext.css";

    /* 首屏占位与全局过渡，样式内联以免额外请求阻塞首个画面。 */
    .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f7f5fa;
        animation: boot-in .35s ease-out both;
    }

    /* 主题尚未初始化时先跟随系统配色，避免深色用户看到白屏闪烁。 */
    @media (prefers-color-scheme: dark) {
        .boot-splash {
            background: #000;
        }

        .boot-splash-name {
            color: #e5eaf3;
        }
    }

    .boot-splash-logo {
        width: 76px;
        height: 76px;
        animation: boot-float 2.4s ease-in-out infinite;
    }

    .boot-splash-name {
        font: 600 17px/1.2 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        letter-spacing: .08em;
        color: var(--el-text-color-primary, #303133);
        opacity: .85;
    }

    .boot-splash-bar {
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: color-mix(in srgb, var(--el-text-color-primary, #303133) 12%, transparent);
    }

    .boot-splash-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, #FE7902, transparent);
        animation: boot-slide 1.1s ease-in-out infinite;
    }

    @keyframes boot-in {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
    }

    @keyframes boot-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(320%); }
    }

    @media (prefers-reduced-motion: reduce) {
        .boot-splash,
        .boot-splash-logo,
        .boot-splash-bar span {
            animation: none;
        }
    }
</style>
<!--自定义CSS-->
<link rel="stylesheet" href="/api/custom.css"/>
<!--自定义JS-->
<script src="/api/custom.js"></script>
</html>

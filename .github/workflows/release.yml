name: 发布版本

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签，留空使用 pom.xml 中的版本（形如 v3.3.0）
        required: false
        type: string
      prerelease:
        description: 标记为预发布
        required: false
        type: boolean
        default: false
      draft:
        description: 保留为草稿
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建发布产物
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 构建产物
        uses: ./.github/actions/build-artifacts

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: 解析版本
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          tag="${INPUT_TAG:-v$version}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "标签格式无效：$tag" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "标签 $tag 已存在，请先更新版本号。" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: mint-soda-dist
          path: dist

      - name: 校验产物与哈希
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum --check sha256.txt
          for artifact in MintSoda.jar MintSoda.exe; do
            if [ ! -s "$artifact" ]; then
              echo "缺少构建产物：$artifact" >&2
              exit 1
            fi
          done

      - name: 发布
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          fail_on_unmatched_files: true
          files: |
            dist/MintSoda.jar
            dist/MintSoda.exe

name: 持续集成

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: 校验工作流
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  commit-messages:
    name: 校验提交信息
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 检查 Conventional Commits
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash .github/scripts/check-commit-messages.sh

  pr-title:
    name: 校验 PR 标题
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 检查标题格式
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/check-pr-title.sh

  build:
    name: 构建 JAR 与 EXE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 构建产物
        uses: ./.github/actions/build-artifacts
